<h2 data-i18n="games.title"></h2>
<p class="lead" data-i18n="games.lead"></p>
<div class="box game" data-open="2026-11-17" data-url="">
  <h3 data-i18n="games.pan.title"></h3>
  <p data-i18n="games.pan.desc"></p>
  <p class="game-state locked"><span data-i18n="games.locked"></span></p>
  <p class="game-state open" style="display:none"><a class="btn" href="#" target="_blank" data-i18n="games.play"></a></p>

<script>
// 到了開放日而且填了網址，鎖頭就換成按鈕；網址填在上面 data-url
document.querySelectorAll('.game').forEach(g=>{const open=new Date(g.dataset.open+'T00:00:00');const url=g.dataset.url;
  if(url&&new Date()>=open){g.querySelector('.locked').style.display='none';const o=g.querySelector('.open');o.style.display='';o.querySelector('a').href=url;}});
</script>
