body{margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16",monospace;

.dbtns button{background:#141015;border:2px solid var(--gold2);color:var(--gold);font-family:inherit;font-size:15px;padding:6px 18px}
.dbtns button:active{background:var(--wine);color:#fff}

  body .dlg .hint{display:none}

footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.2em;margin-top:40px}

/* 巴克的推銷開場，{card} 會換成卡名、{blurb} 換成一句介紹 */
const PITCH=()=>t('pitch');
/* 巴克：扭蛋機頭推銷員，會在房間裡亂晃 */
const BUCK={id:'buck',x:7,y:4,dir:1,timer:60,mx:0,my:0,moving:false};

];

/* 窗外的巡查相馬：玩家站到窗戶正下方那排、左右一格內就會出現 */
const SOMA={url:'https://caveduck.io/zh-hant/share/characters/97199d6f-cfc1-4548-80a2-9d747ba12ebb?rc=ku1A1yGuNy',at:null,timer:0};
/* 只用最右邊那扇窗（靠床那側）；相馬從右側窗格斜斜探進來 */
let SOMA_WIN=null;for(let y=0;y<H;y++)for(let x=W-1;x>=0&&!SOMA_WIN;x--)if(MAP[y][x]==='W')SOMA_WIN=[x,y];
function somaUpdate(){SOMA.at=null;
  if(SOMA_WIN){const [wx,wy]=SOMA_WIN;if(P.y===wy+1&&P.x>=wx-2&&P.x<=wx+1)SOMA.at=SOMA_WIN;}
  SOMA.timer=SOMA.at?SOMA.timer+1:0;}
const somaCv=document.createElement('canvas');somaCv.width=32;somaCv.height=40;const sctx=somaCv.getContext('2d');
function drawSoma(x,y,t){
  const k=(t>>4)&1;const c=sctx;c.clearRect(0,0,32,40);const q=(a,b,w,h,col)=>{c.fillStyle=col;c.fillRect(a,b,w,h)};
  // 在離屏畫一個正的相馬（上半身），之後再斜
  q(9,6,14,5,'#1c1a24');q(8,10,16,2,'#2a2734');q(14,7,4,2,'#c9a227');          // 制帽
  q(10,12,12,9,'#cfae90');q(12,15,2,2,'#1c1a24');q(18,15,2,2,'#1c1a24');q(13,18,6,1,'#8a5a4a'); // 臉（背光偏暗）
  q(12,13,1,1,'#b04a4a');q(19,13,1,1,'#b04a4a');                                   // 耳尖紅
  q(6,21,20,12,'#1c1a24');q(15,21,2,12,'#c9a227');q(8,22,16,1,'#c9a227');          // 制服
  const hx=2,hy=14-k*2;q(hx,hy,5,6,'#cfae90');q(hx+1,hy-2,3,2,'#cfae90');          // 左手貼玻璃（在他的左側＝畫面左）

  if(ASSETS.room){ // 有畫好的底圖：整張貼上，只補會動的東西
    ctx.imageSmoothingEnabled=true;ctx.drawImage(ASSETS.room,0,0,512,288);ctx.imageSmoothingEnabled=false;

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=MAP[y][x],X=x*T,Y=y*T;
    const useImg=n=>{if(ASSETS[n]){ctx.drawImage(ASSETS[n],X,Y,T,T);return true}return false};
    switch(t){
      case '#':useImg('wall')||drawWall(X,Y);break;
      case '.':useImg('floor')||drawFloor(X,Y);break;
      case 'r':useImg('rug')||drawRug(X,Y);break;

      case 'C':useImg('candle')||drawCandle(X,Y,tick);break;
      case 'P':useImg('frame')||drawFrame(X,Y);break;
      case 'G':useImg('mat')||drawMat(X,Y);break;

  if(SOMA.at){ASSETS.soma?ctx.drawImage(ASSETS.soma,SOMA.at[0]*T,SOMA.at[1]*T,T,T):drawSoma(SOMA.at[0]*T,SOMA.at[1]*T,tick);}

  if(meowBubble&&tick<meowBubble.until){const c=CATS.find(k=>k.id===meowBubble.id);if(c){const bx=c.x*T+6,by=c.y*T-12;ctx.fillStyle='#0a0809';ctx.fillRect(bx,by,22,11);ctx.fillStyle='#e8e0d0';ctx.font='9px DotGothic16,monospace';ctx.fillText(window.t('ui.meow'),bx+3,by+9);}}
  // 玩家（走路插值）
  const px_=P.x*T+P.mx, py_=P.y*T+P.my;
  if(ASSETS.player)ctx.drawImage(ASSETS.player,px_,py_,T,T);else drawPlayer(px_,py_);
  // 面前有東西時的提示
  if(!dlgOpen){const f=front();if(f.key){const bb=(tick>>4)&1,ex=px_+14,ey=py_-14-bb;
    px(ex-1,ey-1,5,9,'#0a0809');px(ex-1,ey+9,5,3,'#0a0809');   // 黑底描邊
    px(ex,ey,3,7,'#f0d27a');px(ex,ey+9,3,2,'#f0d27a');px(ex+1,ey,1,7,'#fff');}}   // 驚嘆號
  // 光：先整體壓暗，再加回「窗光投影」（斜四邊形）與燭光
  ctx.fillStyle=ROOM_HAS_LIGHT?'rgba(6,3,10,.12)':'rgba(6,3,10,.30)';ctx.fillRect(0,0,512,288);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const ring=(cx,cy,r,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();};
  const quad=(pts,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<4;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();};
  // 窗光：窗戶正下方一灘光，往下微微張開，愈遠愈淡
  if(!ROOM_HAS_LIGHT)for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(MAP[y][x]==='W'){
    const x0=x*T+2,x1=x*T+T-2,top=(y+1)*T;
    quad([[x0,top],[x1,top],[x1+10,top+88],[x0-10,top+88]],'rgba(255,232,170,.10)');
    quad([[x0+2,top],[x1-2,top],[x1+4,top+60],[x0-4,top+60]],'rgba(255,240,190,.12)');
    quad([[x0+4,top],[x1-4,top],[x1,top+34],[x0,top+34]],'rgba(255,246,210,.14)');
  }
  // 燭光：單層實邊圓，會抖
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(MAP[y][x]==='C'){
    const j=Math.round((Math.sin(tick/22+x*3)+Math.sin(tick/9+x))*1.2)*4;const R=72+j;
    ring(x*T+16,y*T+6,R,ROOM_HAS_LIGHT?'rgba(255,170,70,.10)':'rgba(255,170,70,.22)');}
  ctx.restore();
  // 暗角
  const g=ctx.createRadialGradient(256,144,110,256,144,290);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.38)');ctx.fillStyle=g;ctx.fillRect(0,0,512,288);
}

/* ---------- 移動 ---------- */
const DIRS={ArrowUp:[0,-1,'up'],ArrowDown:[0,1,'down'],ArrowLeft:[-1,0,'left'],ArrowRight:[1,0,'right']};
const held=new Set();let tapQueue=null; // 手機點一下至少走一格
function tryMove(){if(P.moving||dlgOpen){return;}
  if(held.size===0&&!tapQueue&&path.length){const [nx,ny]=path[0];
    if(!walkable(nx,ny)){path=[];autoKey=null;return;}  // 路被貓或巴克擋住就停
    path.shift();const dx=nx-P.x,dy=ny-P.y;P.dir=dx===1?'right':dx===-1?'left':dy===1?'down':'up';
    P.moving=true;P.tx=nx;P.ty=ny;P.mx=0;P.my=0;P.ddx=dx;P.ddy=dy;return;}
  if(held.size||tapQueue){path=[];autoKey=null;}
  const order=tapQueue?[tapQueue,'ArrowUp','ArrowDown','ArrowLeft','ArrowRight']:['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  for(const k of order){if(k!==tapQueue&&!held.has(k))continue;if(k===tapQueue)tapQueue=null;const [dx,dy,d]=DIRS[k];P.dir=d;
    if(!solid(P.x+dx,P.y+dy)){P.moving=true;P.tx=P.x+dx;P.ty=P.y+dy;P.mx=0;P.my=0;P.ddx=dx;P.ddy=dy;}return;}}
function stepMove(){if(!P.moving)return;P.step++;P.mx+=P.ddx*4;P.my+=P.ddy*4;
  if(Math.abs(P.mx)>=T||Math.abs(P.my)>=T){P.x=P.tx;P.y=P.ty;P.mx=0;P.my=0;P.moving=false;if(path.length===0&&autoKey)finishAuto();}}
function buckWander(){if(dlgOpen)return;if(BUCK.hold>0){BUCK.hold--;return;}
  if(BUCK.moving){BUCK.mx+=BUCK.ddx*2;BUCK.my+=BUCK.ddy*2;if(Math.abs(BUCK.mx)>=T||Math.abs(BUCK.my)>=T){BUCK.x=BUCK.tx;BUCK.y=BUCK.ty;BUCK.mx=0;BUCK.my=0;BUCK.moving=false;BUCK.timer=40+Math.random()*80;}return;}
  if(--BUCK.timer>0)return;BUCK.timer=30;
  const d=[[0,-1],[0,1],[-1,0],[1,0]][Math.floor(Math.random()*4)];const nx=BUCK.x+d[0],ny=BUCK.y+d[1];
  const t=tile(nx,ny);if(t!=='.'&&t!=='r')return;
  if(CATS.some(c=>c.x===nx&&c.y===ny))return;if(nx===P.x&&ny===P.y)return;if(P.moving&&P.tx===nx&&P.ty===ny)return;
  BUCK.moving=true;BUCK.tx=nx;BUCK.ty=ny;BUCK.ddx=d[0];BUCK.ddy=d[1];}
function front(){const [dx,dy]=P.dir==='up'?[0,-1]:P.dir==='down'?[0,1]:P.dir==='left'?[-1,0]:[1,0];const cx=P.x+dx,cy=P.y+dy;
  if(BUCK.x===cx&&BUCK.y===cy&&!BUCK.moving)return{key:'buck'};const cat=CATS.find(c=>c.x===cx&&c.y===cy);if(cat)return{key:cat.id};const t=tile(cx,cy);return{key:TALK[t]?t:null};}

  dhint.innerHTML=d.go?t('ui.hint.go'):t('ui.hint.close');document.getElementById('dgo').style.display=d.go?'':'none';
  let i=0;clearInterval(typing);typing=setInterval(()=>{dtext.textContent=d.text.slice(0,++i);if(i>=d.text.length)clearInterval(typing);},28);}
function closeDlg(){dlgOpen=false;dlg.classList.remove('on');clearInterval(typing);}
function action(){if(dlgOpen){if(dtext.textContent.length<(TALK[curKey]||{text:''}).text.length){clearInterval(typing);dtext.textContent=TALK[curKey].text;return;}
    if(dlgGo)location.href=LOC(dlgGo);else closeDlg();return;}
  const f=front();if(f.key){curKey=f.key;if(MEOW_VOICE[f.key])meow(f.key);openDlg(f.key);}}
let curKey=null;
document.getElementById('dgo').addEventListener('click',e=>{e.stopPropagation();action();});
document.getElementById('dclose').addEventListener('click',e=>{e.stopPropagation();closeDlg();});

/* ---------- 點哪走哪 ---------- */
let path=[];let autoKey=null;
function walkable(cx,cy){return cx>=0&&cy>=0&&cx<W&&cy<H&&!solid(cx,cy);}
function bfs(sx,sy,tx,ty){const prev=new Map();const q=[[sx,sy]];prev.set(sx+','+sy,null);
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty){const out=[];let k=x+','+y;while(prev.get(k)){out.unshift(k.split(',').map(Number));k=prev.get(k);}return out;}
    for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){const nx=x+dx,ny=y+dy,kk=nx+','+ny;if(prev.has(kk)||!walkable(nx,ny))continue;prev.set(kk,x+','+y);q.push([nx,ny]);}}
  return null;}
function goTo(tx,ty){if(dlgOpen)return;autoKey=null;
  if(BUCK.x===tx&&BUCK.y===ty&&!BUCK.moving)BUCK.hold=240; // 點到巴克：他先站住等你走過去
  const isCat=CATS.some(c=>c.x===tx&&c.y===ty)||(BUCK.x===tx&&BUCK.y===ty);
  const tt=tile(tx,ty);const target=isCat||TALK[tt]||tt==='W'||tt==='b'||tt==='d'||tt==='M';
  if(walkable(tx,ty)){path=bfs(P.x,P.y,tx,ty)||[];return;}
  if(!target)return;
  // 目標是物件：把整個物件（相連的同類格）都當目標，找最近的相鄰格，再面向它
  const same=c=>{const g={b:'bd',d:'bd'};return (g[tt]||tt).includes(c);};
  const cells=[];if(isCat)cells.push([tx,ty]);else{const seen=new Set();const q=[[tx,ty]];seen.add(tx+','+ty);
    while(q.length){const [x,y]=q.shift();cells.push([x,y]);for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(seen.has(k)||!same(tile(nx,ny)))continue;seen.add(k);q.push([nx,ny]);}}}
  let best=null;
  for(const [ox,oy] of cells){if(!isCat&&CATS.some(c=>c.x===ox&&c.y===oy))continue;for(const [dx,dy] of [[0,1],[0,-1],[-1,0],[1,0]]){const ax=ox+dx,ay=oy+dy;const here=(ax===P.x&&ay===P.y);if(!here&&!walkable(ax,ay))continue;
    const p=here?[]:bfs(P.x,P.y,ax,ay);if(p&&(!best||p.length<best.p.length))best={p,dx,dy};}}
  if(!best)return;path=best.p;autoKey={dir:best.dx===0?(best.dy===1?'up':'down'):(best.dx===1?'left':'right')};
  if(path.length===0)finishAuto();}
function finishAuto(){if(autoKey){P.dir=autoKey.dir;autoKey=null;action();}}
cv.addEventListener('pointerdown',e=>{if(dlgOpen){const full=(TALK[curKey]||{text:''}).text;if(dtext.textContent.length<full.length){clearInterval(typing);dtext.textContent=full;}else closeDlg();return;}const r=cv.getBoundingClientRect();
  const tx=Math.floor((e.clientX-r.left)/r.width*W),ty=Math.floor((e.clientY-r.top)/r.height*H);goTo(tx,ty);});

/* ---------- 輸入 ---------- */
addEventListener('keydown',e=>{if(DIRS[e.key]){held.add(e.key);e.preventDefault();}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();action();}
  if(e.key==='Escape'&&dlgOpen)closeDlg();});
addEventListener('keyup',e=>held.delete(e.key));
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
  const down=e=>{e.preventDefault();if(k===' ')action();else{held.add(k);tapQueue=k;}};const up=e=>{e.preventDefault();held.delete(k);};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);});


/* ---------- 音樂 ----------
   BGM_YT 填 YouTube 影片 ID 就用嵌入播放器（必須可見，這是 YouTube 的規定）；
   留空字串就改用 bgm/room.mp3。瀏覽器規定要先有點擊或按鍵才准出聲。 */
const BGM_YT='pGET78mPMCA';   // 填 YouTube ID 用嵌入播放；留空則用下面的 BGM_MP3
const BGM_MP3='bgm/room.mp3'; // 自己有權利放的音檔，可以是相對路徑或外部網址
const audio=document.getElementById('audio'),bgmBtn=document.getElementById('bgm');
audio.volume=0.35;if(!BGM_YT)audio.src=BGM_MP3;
let bgmOn=false;try{bgmOn=localStorage.getItem('angu_bgm')==='1';}catch(e){}
let yt=null,ytReady=false;
function ytPlay(on){if(!ytReady)return;on?yt.playVideo():yt.pauseVideo();}
function setBgm(on){bgmOn=on;document.body.classList.toggle('playing',on&&!!BGM_YT);bgmBtn.textContent=on?t('ui.bgm.on'):t('ui.bgm.off');bgmBtn.classList.toggle('on',on);
  try{localStorage.setItem('angu_bgm',on?'1':'0');}catch(e){}
  if(BGM_YT){ytPlay(on);}else{if(on)audio.play().catch(()=>{});else audio.pause();}}
bgmBtn.addEventListener('click',e=>{e.stopPropagation();setBgm(!bgmOn);});
let armed=false;function arm(){if(armed)return;armed=true;if(bgmOn)setBgm(true);}
addEventListener('keydown',arm);addEventListener('pointerdown',arm);
if(BGM_YT){
  const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady=function(){yt=new YT.Player('yt',{videoId:BGM_YT,
    playerVars:{loop:1,playlist:BGM_YT,controls:1,rel:0,modestbranding:1,playsinline:1},
    events:{onReady:()=>{ytReady=true;yt.setVolume(40);if(bgmOn&&armed)yt.playVideo();},
            onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING&&!bgmOn){bgmOn=true;document.body.classList.add('playing');bgmBtn.textContent=t('ui.bgm.on');bgmBtn.classList.add('on');}
                              if(e.data===YT.PlayerState.PAUSED&&bgmOn){bgmOn=false;document.body.classList.remove('playing');bgmBtn.textContent=t('ui.bgm.off');bgmBtn.classList.remove('on');}}}});};
}else{document.querySelector('.radio').remove();}
setBgm(bgmOn);

/* ---------- 貓叫白噪音（Web Audio 合成，沒有外部音檔） ----------
   每隻貓有自己的音高與長度，隨機隔 8～25 秒叫一聲，叫的時候頭上冒「喵」。 */
let AC=null;let meowOn=true;try{meowOn=localStorage.getItem('angu_meow')!=='0';}catch(e){}
const MEOW_VOICE={cat_poe:{f:330,len:.55,drop:.6},cat_ono:{f:720,len:.45,drop:.85},cat_bau:{f:420,len:.7,drop:.7},cat_col:{f:560,len:.4,drop:.8},cat_gal:{f:480,len:.5,drop:.75},cat_gar:{f:390,len:.35,drop:.65}};
let meowBubble=null;
function meow(id){if(!meowOn||!armed)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return;}
  const v=MEOW_VOICE[id],t0=AC.currentTime,len=v.len*(0.85+Math.random()*0.3),f=v.f*(0.92+Math.random()*0.16);
  const g=AC.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(0.09,t0+0.04);g.gain.setValueAtTime(0.09,t0+len*0.55);g.gain.exponentialRampToValueAtTime(0.001,t0+len);
  const lp=AC.createBiquadFilter();lp.type='bandpass';lp.frequency.value=f*2.2;lp.Q.value=1.2;
  g.connect(lp);lp.connect(AC.destination);
  // 兩個泛音：基音＋八度，音高先上滑再往下掉，加一點顫音
  [[1,1],[2,.35]].forEach(([mul,amp])=>{const o=AC.createOscillator();o.type='triangle';
    o.frequency.setValueAtTime(f*mul*0.8,t0);o.frequency.exponentialRampToValueAtTime(f*mul*1.15,t0+len*0.3);o.frequency.exponentialRampToValueAtTime(f*mul*v.drop,t0+len);
    const vib=AC.createOscillator();vib.frequency.value=6+Math.random()*3;const vg=AC.createGain();vg.gain.value=f*mul*0.02;vib.connect(vg);vg.connect(o.frequency);
    const og=AC.createGain();og.gain.value=amp;o.connect(og);og.connect(g);o.start(t0);vib.start(t0);o.stop(t0+len+0.05);vib.stop(t0+len+0.05);});
  meowBubble={id,until:tick+40};}
let meowTimer=180+Math.random()*300;
function meowTick(){if(--meowTimer>0)return;meowTimer=(8+Math.random()*17)*60;const c=CATS[Math.floor(Math.random()*CATS.length)];meow(c.id);}
const meowBtn=document.getElementById('meowbtn');
function setMeow(on){meowOn=on;meowBtn.textContent=on?t('ui.meow.on'):t('ui.meow.off');meowBtn.classList.toggle('on',on);try{localStorage.setItem('angu_meow',on?'1':'0');}catch(e){}}
meowBtn.addEventListener('click',e=>{e.stopPropagation();setMeow(!meowOn);if(meowOn){armed=true;meow(CATS[Math.floor(Math.random()*CATS.length)].id);}});
setMeow(meowOn);
// 觸控裝置：把音樂、貓叫兩顆鈕搬出畫面
if(matchMedia('(hover:none) and (pointer:coarse)').matches){const tg=document.getElementById('toggles');tg.appendChild(bgmBtn);tg.appendChild(meowBtn);}

/* ---------- 語言 ---------- */
window.LANG=getLang();buildTalk();
window.onLangChange=function(){buildTalk();if(dlgOpen)closeDlg();bgmBtn.textContent=bgmOn?t('ui.bgm.on'):t('ui.bgm.off');setMeow(meowOn);};

/* ---------- 主迴圈 ---------- */
function loop(){tryMove();stepMove();buckWander();somaUpdate();meowTick();render();requestAnimationFrame(loop);}
loop();
</script>
