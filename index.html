<style>
:root{--bg:#0a0809;--gold:#c9a227;--gold2:#8a6d1c;--wine:#6b0f1a;--ink:#e8e0d0;--muted:#9a8f85}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16",monospace;
  background-image:linear-gradient(rgba(201,162,39,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(201,162,39,.05) 1px,transparent 1px);
  background-size:32px 32px}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 50px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}
h1{margin:0;font-size:22px;letter-spacing:.3em}
h1 small{display:block;font-family:"Press Start 2P",monospace;font-size:9px;color:var(--gold);letter-spacing:.1em;margin-top:6px}
.motto{font-size:14px;color:var(--muted);text-align:right}
.stage{position:relative;width:100%;max-width:1024px;margin:0 auto;aspect-ratio:16/9;
  border:4px solid var(--gold2);outline:2px solid var(--gold);outline-offset:4px;background:#000;
  box-shadow:0 0 40px #000, 0 0 70px rgba(107,15,26,.3)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* 對話框 */
.dlg{position:absolute;left:3%;right:3%;bottom:3%;background:rgba(8,6,10,.94);border:3px solid var(--gold);
  box-shadow:inset 0 0 0 2px #000, inset 0 0 0 3px var(--gold2);padding:14px 18px;font-size:clamp(13px,1.8vw,18px);line-height:1.7;display:none}
.dlg.on{display:block}
.dlg .name{color:var(--gold);font-size:.85em;margin-bottom:4px;letter-spacing:.2em}
.dlg .hint{color:var(--muted);font-size:.75em;text-align:right;margin-top:6px}
.dlg .hint b{color:var(--gold)}
/* 手機虛擬鍵 */
.pad{display:none;justify-content:space-between;align-items:center;max-width:1024px;margin:14px auto 0;padding:0 6px}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.dpad button,.act button{background:#141015;border:2px solid var(--gold2);color:var(--gold);font-size:20px;font-family:inherit;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dpad button:active,.act button:active{background:var(--wine);color:#fff}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.act button{width:84px;height:84px;border-radius:50%;font-size:16px}
@media (hover:none) and (pointer:coarse){.pad{display:flex}}
.radio{position:fixed;right:14px;bottom:14px;z-index:20;width:200px;padding:8px 8px 20px;background:#2b1a14;border:2px solid #8a6d1c;outline:1px solid var(--gold);outline-offset:2px;box-shadow:4px 4px 0 #000;border-radius:8px 8px 4px 4px;
  transform:translateY(130%);opacity:0;transition:.35s}
body.playing .radio{transform:none;opacity:1}
.radio .screen{width:184px;height:184px;background:#000;border:1px solid #c9a227}
.radio .screen iframe,.radio .screen>div{width:100%;height:100%;display:block}
.radio .knobs{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:12px;align-items:center}
.radio .knobs i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0d27a,#8a6d1c 70%);border:1px solid #000;display:block}
.radio .knobs b{font-family:"Press Start 2P",monospace;font-size:6px;color:var(--gold);letter-spacing:.1em}
.keys{text-align:center;color:var(--muted);font-size:13px;margin-top:12px;letter-spacing:.1em}
.keys b{color:var(--gold);border:1px solid var(--gold2);padding:1px 7px;margin:0 2px}
nav.main{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:24px}
nav.main a{border:2px solid var(--gold2);padding:7px 18px;letter-spacing:.2em;font-size:14px;color:var(--ink);text-decoration:none;background:#141015;box-shadow:3px 3px 0 #000}
nav.main a:hover,nav.main a.on{background:var(--wine);border-color:var(--gold);color:#fff}
.bgm{position:absolute;top:8px;right:8px;z-index:5;background:rgba(8,6,10,.9);border:2px solid var(--gold2);color:var(--gold);font-family:inherit;font-size:13px;padding:4px 10px;cursor:pointer;letter-spacing:.1em}
.bgm.on{border-color:var(--gold);color:#fff;background:var(--wine)}
footer a{color:var(--gold);text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.2em;margin-top:40px}
</style>
</head>

function drawMat(x,y){drawFloor(x,y);px(x+2,y+6,T-4,20,'#4b0f18');px(x+4,y+8,T-8,16,'#6b0f1a');}
function drawCat(x,y,c,t){const [body,acc,eye]=c;const e1=Array.isArray(eye)?eye[0]:eye,e2=Array.isArray(eye)?eye[1]:eye;const bob=(t>>4)&1;

  px(x+9,y+22-bob,8,3,acc);px(x+6,y+5-bob,12,3,acc);}

  px(hx+8,hy+10,4,4,'#f4f0e6');px(hx+9,hy+11,2,2,'#111');          // 轉盤

function drawPlayer(x,y){const f=P.moving?((P.step>>2)&1):0;const leg=f?2:0;
  px(x+10,y+2,12,10,'#f4f4f4');px(x+8,y+0,3,4,'#c9a227');px(x+21,y+0,3,4,'#c9a227');px(x+9,y+0,1,2,'#c9a227');px(x+22,y+0,1,2,'#c9a227');

  px(x+10,y+18,12,10,'#111');px(x+10,y+18,12,1,'#c9a227');px(x+8,y+24,16,4,'#111');px(x+8,y+27,16,1,'#c9a227');px(x+14,y+20,4,2,'#c9a227');

/* 格子型別 */
function tile(cx,cy){return (MAP[cy]||'')[cx]||'#';}
function solid(cx,cy){const t=tile(cx,cy);return t==='#'||'WBDSbdCPM'.includes(t)||CATS.some(c=>c.x===cx&&c.y===cy)||(BUCK.x===cx&&BUCK.y===cy)||(BUCK.moving&&BUCK.tx===cx&&BUCK.ty===cy);}

/* ---------- 渲染 ---------- */
let tick=0;
function drawFlame(x,y,t){const f=(t>>4)&1;px(x+15,y+2+f,2,4,'#f0d27a');px(x+15,y+1+f,2,1,'#ff8c42');}
function render(){tick++;
  if(ASSETS.room){ // 有畫好的底圖：整張貼上，只補會動的東西
    ctx.drawImage(ASSETS.room,0,0);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=MAP[y][x];
      if(t==='C')drawFlame(x*T,y*T,tick);
      if(t==='M'){ASSETS.gramophone?ctx.drawImage(ASSETS.gramophone,x*T,y*T,T,T):drawGramophone(x*T,y*T,tick);}}
  }else
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=MAP[y][x],X=x*T,Y=y*T;
    const useImg=n=>{if(ASSETS[n]){ctx.drawImage(ASSETS[n],X,Y,T,T);return true}return false};
    switch(t){
      case '#':useImg('wall')||drawWall(X,Y);break;
      case '.':useImg('floor')||drawFloor(X,Y);break;
      case 'r':useImg('rug')||drawRug(X,Y);break;
      case 'W':useImg('window')||drawWindow(X,Y);break;
      case 'B':useImg('bookshelf')||drawBookshelf(X,Y);break;
      case 'D':useImg('desk')||drawDesk(X,Y,MAP[y-1][x]!=='D');break;
      case 'b':useImg('bed_head')||drawBed(X,Y,true);break;
      case 'd':useImg('bed_foot')||drawBed(X,Y,false);break;
      case 'S':useImg('trophy')||drawTrophy(X,Y);break;
      case 'C':useImg('candle')||drawCandle(X,Y,tick);break;
      case 'P':useImg('frame')||drawFrame(X,Y);break;
      case 'G':useImg('mat')||drawMat(X,Y);break;
      case 'M':useImg('gramophone')||drawGramophone(X,Y,tick);break;
    }}
  CATS.forEach(c=>{if(ASSETS[c.id])ctx.drawImage(ASSETS[c.id],c.x*T,c.y*T,T,T);else drawCat(c.x*T,c.y*T,c.c,tick+c.x*7);});
  if(ASSETS.buck)ctx.drawImage(ASSETS.buck,BUCK.x*T+BUCK.mx,BUCK.y*T+BUCK.my,T,T);else drawBuck(BUCK.x*T+BUCK.mx,BUCK.y*T+BUCK.my,tick);
  // 玩家（走路插值）
  const px_=P.x*T+P.mx, py_=P.y*T+P.my;
  if(ASSETS.player)ctx.drawImage(ASSETS.player,px_,py_,T,T);else drawPlayer(px_,py_);
  // 面前有東西時的提示
  if(!dlgOpen){const f=front();if(f.key){px(px_+12,py_-10,8,8,'#c9a227');px(px_+14,py_-8,4,4,'#0a0809');px(px_+15,py_-7,2,1,'#c9a227');}}
  // 光：先整體壓暗，再加回「窗光投影」（斜四邊形）與燭光
  ctx.fillStyle='rgba(6,3,10,.30)';ctx.fillRect(0,0,512,288);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const ring=(cx,cy,r,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();};
  const quad=(pts,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<4;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();};
  // 窗光：窗戶正下方一灘光，往下微微張開，愈遠愈淡
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(MAP[y][x]==='W'){
    const x0=x*T+2,x1=x*T+T-2,top=(y+1)*T;
    quad([[x0,top],[x1,top],[x1+10,top+88],[x0-10,top+88]],'rgba(255,232,170,.10)');
    quad([[x0+2,top],[x1-2,top],[x1+4,top+60],[x0-4,top+60]],'rgba(255,240,190,.12)');
    quad([[x0+4,top],[x1-4,top],[x1,top+34],[x0,top+34]],'rgba(255,246,210,.14)');
  }
  // 燭光：單層實邊圓，會抖
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(MAP[y][x]==='C'){
    const j=Math.round((Math.sin(tick/22+x*3)+Math.sin(tick/9+x))*1.2)*4;const R=72+j;
    ring(x*T+16,y*T+6,R,'rgba(255,170,70,.22)');}
  ctx.restore();
  // 暗角
  const g=ctx.createRadialGradient(256,144,110,256,144,290);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.38)');ctx.fillStyle=g;ctx.fillRect(0,0,512,288);
}

/* ---------- 移動 ---------- */
const DIRS={ArrowUp:[0,-1,'up'],ArrowDown:[0,1,'down'],ArrowLeft:[-1,0,'left'],ArrowRight:[1,0,'right']};
const held=new Set();
function tryMove(){if(P.moving||dlgOpen)return;
  for(const k of ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']){if(!held.has(k))continue;const [dx,dy,d]=DIRS[k];P.dir=d;
    if(!solid(P.x+dx,P.y+dy)){P.moving=true;P.tx=P.x+dx;P.ty=P.y+dy;P.mx=0;P.my=0;P.ddx=dx;P.ddy=dy;}return;}}
function stepMove(){if(!P.moving)return;P.step++;P.mx+=P.ddx*4;P.my+=P.ddy*4;
  if(Math.abs(P.mx)>=T||Math.abs(P.my)>=T){P.x=P.tx;P.y=P.ty;P.mx=0;P.my=0;P.moving=false;}}
function buckWander(){if(dlgOpen)return;
  if(BUCK.moving){BUCK.mx+=BUCK.ddx*2;BUCK.my+=BUCK.ddy*2;if(Math.abs(BUCK.mx)>=T||Math.abs(BUCK.my)>=T){BUCK.x=BUCK.tx;BUCK.y=BUCK.ty;BUCK.mx=0;BUCK.my=0;BUCK.moving=false;BUCK.timer=40+Math.random()*80;}return;}
  if(--BUCK.timer>0)return;BUCK.timer=30;
  const d=[[0,-1],[0,1],[-1,0],[1,0]][Math.floor(Math.random()*4)];const nx=BUCK.x+d[0],ny=BUCK.y+d[1];
  const t=tile(nx,ny);if(t!=='.'&&t!=='r')return;
  if(CATS.some(c=>c.x===nx&&c.y===ny))return;if(nx===P.x&&ny===P.y)return;if(P.moving&&P.tx===nx&&P.ty===ny)return;
  BUCK.moving=true;BUCK.tx=nx;BUCK.ty=ny;BUCK.ddx=d[0];BUCK.ddy=d[1];}
function front(){const [dx,dy]=P.dir==='up'?[0,-1]:P.dir==='down'?[0,1]:P.dir==='left'?[-1,0]:[1,0];const cx=P.x+dx,cy=P.y+dy;
  if(BUCK.x===cx&&BUCK.y===cy&&!BUCK.moving)return{key:'buck'};const cat=CATS.find(c=>c.x===cx&&c.y===cy);if(cat)return{key:cat.id};const t=tile(cx,cy);return{key:TALK[t]?t:null};}

/* ---------- 對話框 ---------- */
const dlg=document.getElementById('dlg'),dname=document.getElementById('dname'),dtext=document.getElementById('dtext'),dhint=document.getElementById('dhint');
let dlgOpen=false,dlgGo=null,typing=null;
function openDlg(key){let d=TALK[key];
  if(key==='b'){const now=new Date(),h=now.getHours()+now.getMinutes()/60;const asleep=(h>=22.5||h<6);
    d={name:'床',text:asleep?'被子裡有人。安谷十點半就睡了，別吵，有事明天再說。':'黑絲絨床罩鋪得很整齊，枕頭底下壓著沒寫完的卡。安谷十點半準時睡，現在還沒到。'};TALK.b=d;}
  if(key==='M'){setBgm(!bgmOn);d={name:'唱機',text:bgmOn?'唱針放下去了。柯賴里《佛利亞變奏曲》，米爾斯坦演奏。':'唱針抬起來了。房間安靜下來。'};TALK.M=d;}
  if(key==='buck'){const c=CARDS[Math.floor(Math.random()*CARDS.length)];const p=PITCH[Math.floor(Math.random()*PITCH.length)];
    let text=p.replace('{card}','「'+c.name+'」').replace('{blurb}',c.blurb?c.blurb:'');
    if(c.name==='巴克・羅塞特')text='……這顆是我自己。老闆說連我也要上架，那就上架。要帶走嗎？先說好，我不退貨。';
    d={name:BUCK.name,text,go:c.url};TALK.buck=d;}
  if(!d)return;dlgOpen=true;dlgGo=d.go||null;dname.textContent=d.name;dtext.textContent='';dlg.classList.add('on');
  dhint.innerHTML=d.go?'<b>空白鍵</b> 前往　<b>Esc</b> 取消':'<b>空白鍵</b> 關閉';
  let i=0;clearInterval(typing);typing=setInterval(()=>{dtext.textContent=d.text.slice(0,++i);if(i>=d.text.length)clearInterval(typing);},28);}
function closeDlg(){dlgOpen=false;dlg.classList.remove('on');clearInterval(typing);}
function action(){if(dlgOpen){if(dtext.textContent.length<(TALK[curKey]||{text:''}).text.length){clearInterval(typing);dtext.textContent=TALK[curKey].text;return;}
    if(dlgGo)location.href=dlgGo;else closeDlg();return;}
  const f=front();if(f.key){curKey=f.key;openDlg(f.key);}}
let curKey=null;

/* ---------- 輸入 ---------- */
addEventListener('keydown',e=>{if(DIRS[e.key]){held.add(e.key);e.preventDefault();}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();action();}
  if(e.key==='Escape'&&dlgOpen)closeDlg();});
addEventListener('keyup',e=>held.delete(e.key));
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
  const down=e=>{e.preventDefault();if(k===' ')action();else held.add(k);};const up=e=>{e.preventDefault();held.delete(k);};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);});
cv.addEventListener('click',()=>{if(dlgOpen)action();});

/* ---------- 音樂 ----------
   BGM_YT 填 YouTube 影片 ID 就用嵌入播放器（必須可見，這是 YouTube 的規定）；
   留空字串就改用 bgm/room.mp3。瀏覽器規定要先有點擊或按鍵才准出聲。 */
const BGM_YT='pGET78mPMCA';   // 填 YouTube ID 用嵌入播放；留空則用下面的 BGM_MP3
const BGM_MP3='bgm/room.mp3'; // 自己有權利放的音檔，可以是相對路徑或外部網址
const audio=document.getElementById('audio'),bgmBtn=document.getElementById('bgm');
audio.volume=0.35;if(!BGM_YT)audio.src=BGM_MP3;
let bgmOn=false;try{bgmOn=localStorage.getItem('angu_bgm')==='1';}catch(e){}
let yt=null,ytReady=false;
function ytPlay(on){if(!ytReady)return;on?yt.playVideo():yt.pauseVideo();}
function setBgm(on){bgmOn=on;document.body.classList.toggle('playing',on&&!!BGM_YT);bgmBtn.textContent=on?'♪ 音樂：開':'♪ 音樂：關';bgmBtn.classList.toggle('on',on);
  try{localStorage.setItem('angu_bgm',on?'1':'0');}catch(e){}
  if(BGM_YT){ytPlay(on);}else{if(on)audio.play().catch(()=>{});else audio.pause();}}
bgmBtn.addEventListener('click',e=>{e.stopPropagation();setBgm(!bgmOn);});
let armed=false;function arm(){if(armed)return;armed=true;if(bgmOn)setBgm(true);}
addEventListener('keydown',arm);addEventListener('pointerdown',arm);
if(BGM_YT){
  const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady=function(){yt=new YT.Player('yt',{videoId:BGM_YT,
    playerVars:{loop:1,playlist:BGM_YT,controls:1,rel:0,modestbranding:1,playsinline:1},
    events:{onReady:()=>{ytReady=true;yt.setVolume(40);if(bgmOn&&armed)yt.playVideo();},
            onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING&&!bgmOn){bgmOn=true;document.body.classList.add('playing');bgmBtn.textContent='♪ 音樂：開';bgmBtn.classList.add('on');}
                              if(e.data===YT.PlayerState.PAUSED&&bgmOn){bgmOn=false;document.body.classList.remove('playing');bgmBtn.textContent='♪ 音樂：關';bgmBtn.classList.remove('on');}}}});};
}else{document.querySelector('.radio').remove();}
setBgm(bgmOn);

/* ---------- 主迴圈 ---------- */
function loop(){tryMove();stepMove();buckWander();render();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
